    <!--
      Person structured data. This is what actually helps search
      engines understand that the GitHub, LinkedIn, Instagram and
      Facebook profiles below all belong to the same person as this
      site — update the "sameAs" list any time a handle changes.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mohammed Muneeb PT",
        "url": "https://muneeb-pt.github.io/",
        "image": "https://avatars.githubusercontent.com/u/247439067?v=4",
        "jobTitle": "Computer Science Engineering Student",
        "alumniOf": "KMEA Engineering College",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Kerala",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://github.com/Muneeb-PT",
          "https://www.linkedin.com/in/mohammed-muneeb-pt",
          "https://www.instagram.com/mohammed_muneeb_pt",
          "https://www.facebook.com/share/19UAkcJsvG/",
          "https://tinkerhub.org/@muneebpt"
        ]
      }
    </script>

    <script>
      // Pairs with public/404.html: GitHub Pages has no server-side
      // routing, so a deep link or hard refresh to e.g. /work 404s.
      // 404.html stashes the intended path and bounces here; this
      // restores it via history.replaceState before React Router
      // reads the URL, so the correct route renders on first paint.
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect");
        sessionStorage.removeItem("spa-redirect");
        if (redirect && redirect !== location.pathname + location.search + location.hash) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
